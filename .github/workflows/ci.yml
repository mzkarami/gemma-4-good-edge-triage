name: Edge-Triage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and import-boundary smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run CI-safe validation
        run: uv run python scripts/run_ci_tests.py

      - name: CLI help smoke
        run: uv run python edge-triage-cli.py --help

      - name: Sandbox help smoke
        run: uv run python triage_sandbox.py --help
