server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicitly fail closed for repo/internal-looking paths so the SPA
    # fallback never makes sensitive probes look like successful content.
    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/(docs|models|logs|data|notebooks?)(/|$) {
        return 404;
    }

    location ~ ^/(env|server-status|actuator|debug|admin|wp-login\.php)(/|$) {
        return 404;
    }

    location ~ ^/(results\.tsv|sandbox_results\.tsv|uv\.lock|pyproject\.toml|submission_notebook\.ipynb|analysis\.ipynb)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $live_api "http://edge-triage-live-api:8080";
        proxy_pass $live_api$request_uri;
    }

    location = /data.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|html)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
