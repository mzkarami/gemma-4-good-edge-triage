[project]
name = "edge-triage"
version = "0.1.0"
description = "Local-first disaster triage with Gemma"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.4",
    "huggingface-hub>=1.10.1",
    "ipykernel>=7.2.0",
    "kernels>=0.12.3",
    "llama-cpp-python>=0.3.20",
    "matplotlib>=3.10.8",
    "mediapipe>=0.10.33",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pillow>=12.0.0",
    "pyarrow>=21.0.0",
    "rich>=14.0.0",
    "requests>=2.33.1",
    "rustbpe>=0.1.0",
    "scikit-learn>=1.7.2",
    "tiktoken>=0.11.0",
    "torch==2.11.0",
    "tqdm>=4.67.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "kaggle>=2.1.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
