name: Edge-Triage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and import-boundary smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check docs links
        run: python3 scripts/check_docs_links.py

      - name: Run CI-safe unit tests
        run: >-
          uv run python -m unittest
          tests.test_bootloader
          tests.test_cli_import_boundary
          tests.test_edge_triage_core
          tests.test_field_tool
          tests.test_live_api
          tests.test_live_api_security_controls
          tests.test_live_deployment
          tests.test_local_extractor_sources
          tests.test_optional_e2e_smoke
          tests.test_site_live_ui
          -v

      - name: CLI help smoke
        run: uv run python edge-triage-cli.py --help

      - name: Sandbox help smoke
        run: uv run python triage_sandbox.py --help
